<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Red studio abstract</title>
  <desc id="desc">Abstract red and black studio-inspired background for Bersulang Records.</desc>
  <defs>
    <radialGradient id="r" cx="62%" cy="28%" r="62%">
      <stop offset="0" stop-color="#ff2200" stop-opacity="0.92"/>
      <stop offset="0.36" stop-color="#5d0b04" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.18"/></feComponentTransfer>
    </filter>
    <linearGradient id="line" x1="0" x2="1">
      <stop stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#r)"/>
  <g opacity="0.45">
    <circle cx="945" cy="380" r="145" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="900" y="235" width="90" height="290" rx="45" fill="none" stroke="#fff" stroke-width="5" opacity="0.38"/>
    <path d="M830 420c0 75 55 138 115 138s115-63 115-138" fill="none" stroke="#fff" stroke-width="5" opacity="0.28"/>
    <path d="M945 558v125M865 683h160" stroke="#fff" stroke-width="5" opacity="0.28"/>
  </g>
  <g opacity="0.18">
    <path d="M0 700 C300 650 420 880 780 780 S1270 620 1600 710" fill="none" stroke="url(#line)" stroke-width="3"/>
    <path d="M0 760 C320 690 510 930 820 820 S1260 680 1600 790" fill="none" stroke="url(#line)" stroke-width="2"/>
  </g>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.65"/>
  <rect width="1600" height="1000" fill="#050505" opacity="0.22"/>
</svg>
