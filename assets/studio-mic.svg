<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1600" role="img" aria-labelledby="title desc">
  <title id="title">Bersulang red studio atmosphere</title>
  <desc id="desc">Abstract red and black studio-inspired background for Bersulang Records.</desc>
  <defs>
    <radialGradient id="r" cx="68%" cy="38%" r="70%">
      <stop offset="0" stop-color="#ff3a17" stop-opacity="0.92"/>
      <stop offset="0.35" stop-color="#761108" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="v" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#050505" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#050505" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 0.14"/></feComponentTransfer></filter>
  </defs>
  <rect width="2400" height="1600" fill="url(#r)"/>
  <rect width="2400" height="1600" fill="url(#v)"/>
  <g opacity="0.22" fill="none" stroke="#ffffff" stroke-width="2">
    <circle cx="1630" cy="470" r="250"/>
    <circle cx="1630" cy="470" r="420"/>
    <path d="M1180 1270 C1370 930 1490 690 1630 470"/>
    <path d="M1760 730 C1900 980 2000 1170 2130 1490"/>
  </g>
  <g fill="#000000" opacity="0.55">
    <rect x="0" y="1130" width="2400" height="470"/>
    <rect x="1120" y="900" width="110" height="450" rx="55"/>
    <rect x="1055" y="835" width="240" height="120" rx="60"/>
    <rect x="1510" y="280" width="245" height="420" rx="122"/>
    <rect x="1600" y="655" width="58" height="520" rx="29"/>
    <rect x="1450" y="1170" width="360" height="54" rx="27"/>
  </g>
  <rect width="2400" height="1600" filter="url(#grain)"/>
</svg>
